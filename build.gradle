plugins {
    id 'java'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// The -javadoc jar is a release artifact, not a build check: `build` leaves it (and the javadoc run
// behind it) out, `gradlew build -Prelease` builds it with everything else, and naming javadocJar
// builds it alone. api/build.gradle does the same for the api jar.
if (!providers.gradleProperty('release').map { it != 'false' }.getOrElse(false)) {
    tasks.named('assemble') {
        setDependsOn(dependsOn.findAll { !((it instanceof Task || it instanceof TaskProvider) && it.name == 'javadocJar') })
    }
}

group = project.group
version = project.version

repositories {
    mavenCentral()
}

// Compile against the SAME jar the server runs. In a workspace, its family.properties (at
// workspaceRoot) names hytaleHome, patchline and game_build once for every family build; built
// alone, with no family.properties there, this repo's gradle.properties gives them. These locals
// shadow the gradle.properties values of the same names for the rest of this script.
def familyBuildKeys = new Properties()
def familyBuildKeysFile = new File(rootProject.file(workspaceRoot), 'family.properties')
if (familyBuildKeysFile.isFile()) {
    familyBuildKeysFile.withReader('UTF-8') { familyBuildKeys.load(it) }
}
def buildKey = { String key -> familyBuildKeys.getProperty(key)?.trim() ?: property(key).toString() }
def hytaleHome = buildKey('hytaleHome')
def patchline = buildKey('patchline')
def game_build = buildKey('game_build')
def hytaleServerJar = new File("${hytaleHome}/${patchline}/package/game/${game_build}/Server/HytaleServer.jar")
// The workspace's path map: family.properties at workspaceRoot (gradle.properties, relative to this
// project dir) names every family repo and pack by its path under that root. Read on first use.
def workspaceDir = rootProject.file(workspaceRoot)
def familyMap = null
def familyPath = { String key ->
    if (familyMap == null) {
        def mapFile = new File(workspaceDir, 'family.properties')
        if (!mapFile.isFile()) {
            throw new GradleException("no family.properties at ${workspaceDir.canonicalPath} (workspaceRoot=${workspaceRoot} in gradle.properties)")
        }
        familyMap = new Properties()
        mapFile.withReader('UTF-8') { familyMap.load(it) }
    }
    String rel = familyMap.getProperty(key)?.trim()
    if (!rel) {
        throw new GradleException("family.properties at ${workspaceDir.canonicalPath} has no ${key}")
    }
    new File(workspaceDir, rel)
}
// The shared primitive lib: the sibling ziggfreed-common repo's own build output. NEVER bundled
// (double-loading engine-touching classes under two classloaders breaks identity, per common's rules).
def ziggfreedCommonJar = new File(familyPath('repo.ziggfreed-common'), "build/libs/ZiggfreedCommon-${ziggfreedCommonVersion}.jar")
// Inside the family's umbrella build (the workspace root's settings.gradle includes this one, so it
// has a parent build), the lib is its coordinate, which the umbrella substitutes with the project
// that builds that jar in the same run. Built alone, it is the jar above.
def ziggfreedCommon = gradle.parent != null ? "ziggfreed:ZiggfreedCommon:${ziggfreedCommonVersion}" : files(ziggfreedCommonJar)

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // jsr305 for @Nonnull/@Nullable. NOT compileOnly: these classes ship in the jar
    // and consumers compileOnly against it, so the annotations must resolve there too.
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // The Hytale server jar is provided at runtime (the server loads it first), so we
    // NEVER bundle it - bundling would double-load engine classes under two classloaders.
    compileOnly(files(hytaleServerJar))

    // ziggfreed-common is a HARD runtime dependency (manifest Dependencies, loads
    // first): compileOnly so com.ziggfreed.common.* compiles. NEVER bundled.
    compileOnly(ziggfreedCommon)

    // The api module: BUNDLED into the runtime jar (see the jar{} block below), and
    // it also builds standalone as rpg-stations-api-<api_version>.jar for compile-time
    // consumers (the kweebec-nightmare api-bundling mechanic).
    implementation project(':api')

    // Tests compile + run the pure engine paths, which need the server jar's shaded
    // Gson + codec classes plus ziggfreed-common on the TEST classpath too.
    testImplementation(files(hytaleServerJar))
    testImplementation(ziggfreedCommon)
}

// Bundle the :api module classes into the plugin jar (excluding service files so the
// engine does not double-register), mirroring kweebec-nightmare's build.gradle. The
// :api module also produces its own standalone jar (api/build.gradle) for anyone
// compiling against RpgStations without pulling in the whole runtime jar.
configurations {
    apiBundle
}

dependencies {
    apiBundle project(':api')
}

jar {
    dependsOn ':api:jar'

    from({
        configurations.apiBundle.collect { zipTree(it) }
    }) {
        exclude 'META-INF/services/**'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

// Never call a deprecated engine API (family-wide rule, the workspace's
// .claude/rules/java-conventions.md): -Xlint:removal surfaces every Hytale API annotated @Deprecated(forRemoval = true)
// still in use, and -Werror promotes that warning to a hard compile failure, mirroring the MMO
// jar's own compileJava flag. A future Hytale server update that deprecates-for-removal an API
// this mod calls will now fail the build on sight instead of silently degrading toward a removed
// API. compileJava only (not compileTestJava), matching the MMO jar's own scoping. A plain
// @Deprecated call compiles green here: gradle/deprecation-gate.gradle, applied below (and by
// api/build.gradle) and run by `check`, compiles every source set again with -Xlint:deprecation
// and fails on any such call not marked "// DEPRECATION-KEPT: <why>" (that flag stays off
// compileJava, whose -Werror would fail a marked call too). The gate file is the MMO's
// (mmo-family/mmo-skills), copied byte for byte: change it there and copy it here.
compileJava {
    options.compilerArgs << '-Xlint:removal' << '-Werror'
}

apply from: "$rootDir/gradle/deprecation-gate.gradle"

test {
    useJUnitPlatform()
    // MmoAgnosticismTest scans the in-repo docs/ prose as well as the code and resources, so a
    // docs-only change must re-run the tests rather than leave the task UP-TO-DATE.
    inputs.dir('docs').withPropertyName('docsProse').withPathSensitivity(PathSensitivity.RELATIVE)
    // ShippedAssetDecodeTest and SawmillSocketParityTest also decode the companion pack's station
    // assets when the workspace holds it (pack.skill-stations-pack in the path map): the test JVM
    // reads its folder from this property, and a pack-only edit must re-run them.
    def companionPack = familyPath('pack.skill-stations-pack')
    systemProperty 'rpgstations.companionPack', companionPack.canonicalPath
    if (companionPack.isDirectory()) {
        inputs.files(fileTree(companionPack) {
            include 'Server/RpgStations/**'
            include 'unreleased/Server/RpgStations/**'
        }).withPropertyName('companionPackStations').withPathSensitivity(PathSensitivity.RELATIVE)
    }
}

// Every test JVM: a 512 MB heap, the serial collector and C1-only compilation, which start fastest
// for a JVM that lives seconds, never long enough for C2 or a parallel GC to pay off.
tasks.withType(Test).configureEach {
    maxHeapSize = '512m'
    jvmArgs '-XX:+UseSerialGC', '-XX:TieredStopAtLevel=1'
    // Never from the build cache: a test can read an input no task declares, and a -D generator run
    // writes files that are no task's output, so only a real run proves it. UP-TO-DATE still skips
    // a test task whose declared inputs are unchanged.
    outputs.cacheIf('tests read undeclared inputs') { false }
}

// Regenerate the repo-root SCHEMA.md schema reference from the actual asset codecs, the
// generateEnglishLang JavaExec pattern. Classpath needs the compiled classes PLUS every
// compile-time dependency (compileClasspath, not runtimeClasspath): SchemaDocWriter loads
// StationAsset/ActionDef/... and therefore transitively the Hytale server jar's codec classes,
// which are compileOnly and NEVER bundled - unlike generateEnglishLang/generateXpTokenItems, whose
// generators touch no Hytale API. Run ON DEMAND (`gradlew generateSchemaDocs`); the output is
// committed and NOT wired into processResources/build (SCHEMA.md is repo documentation, not a JAR
// resource).
def schemaDocOutput = file('SCHEMA.md')
tasks.register('generateSchemaDocs', JavaExec) {
    dependsOn 'compileJava'
    group = 'documentation'
    description = 'Regenerate the repo-root SCHEMA.md schema reference from the RpgStations asset codecs'
    classpath = sourceSets.main.output.classesDirs + configurations.compileClasspath
    mainClass = 'com.ziggfreed.rpgstations.docs.SchemaDocWriter'
    args schemaDocOutput.absolutePath
    inputs.files(fileTree('src/main/java/com/ziggfreed/rpgstations/asset') { include '**/*.java' })
    inputs.file('src/main/java/com/ziggfreed/rpgstations/docs/SchemaDocWriter.java')
    outputs.file(schemaDocOutput)
}

processResources {
    var expandProps = [
            'name'           : project.name,
            'version'        : project.version,
            'group'          : project.group,
            'mod_description': project.findProperty('mod_description') ?: '',
            'website'        : project.findProperty('website') ?: '',
            'entry_point'    : project.findProperty('entry_point') ?: ''
    ]

    filesMatching(['manifest.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
