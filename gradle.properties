group=Ziggfreed
name=RpgStations
version=1.1.0
# The api artifact is versioned WITH the mod: the api jar a consumer compiles against carries
# the same number as the RpgStations release it shipped in (1.0.0 carried contract 9, 1.1.0
# carries 10). RpgStationsApi.apiVersion() is the separate additive contract number a consumer
# branches on at runtime; it moves by one per addition batch, on its own scale.
api_version=1.1.0
java_version=25
mod_description=RPG Stations - diegetic interactive work stations (sawmill, forge, and friends) as a standalone Hytale mod.
website=https://github.com/arfemia/hytale-rpg-stations
game_build=latest
entry_point=com.ziggfreed.rpgstations.RpgStationsPlugin

# Compile against the SAME jar the server runs (path built from
# hytaleHome/patchline/game_build in build.gradle). In a workspace, its family.properties'
# keys of the same names replace these; these values serve a build of this repo alone.
hytaleHome=D:/Games/Hytale/install
patchline=release

# The workspace root, relative to this project dir: the folder whose family.properties maps every
# family repo and pack to its path. build.gradle (and api/build.gradle) resolve the ziggfreed-common
# jar through repo.ziggfreed-common, and forward pack.skill-stations-pack to the test JVM as
# rpgstations.companionPack, where the tests find the companion pack's station assets.
workspaceRoot=../..

# Ziggfreed Common (Group "Ziggfreed", Name "ZiggfreedCommon") - a HARD runtime
# dependency (manifest Dependencies, loads first). compileOnly + testImplementation
# against the sibling repo's built jar (repo.ziggfreed-common in family.properties, build/libs)
# so com.ziggfreed.common.* compiles; the server provides it at runtime, so
# it is NEVER bundled (bundling double-loads its engine-touching classes under two
# classloaders). This is the ONLY dependency - RpgStations is standalone, optionally
# listened to by other mods and never a consumer of one.
ziggfreedCommonVersion=2.2.0

# Gradle itself, the same in every family repo so one daemon serves them all (a different value
# here starts a second daemon): projects build in parallel, task outputs go to the build cache
# (its folder is set in settings.gradle), and an idle daemon exits after 30 minutes. The
# configuration cache stays off.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=1800000
