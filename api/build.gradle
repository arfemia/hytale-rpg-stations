plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// The -javadoc jar is a release artifact, not a build check: `build` leaves it (and the javadoc run
// behind it) out, `gradlew build -Prelease` builds it with everything else, and naming javadocJar
// builds it alone.
if (!providers.gradleProperty('release').map { it != 'false' }.getOrElse(false)) {
    tasks.named('assemble') {
        setDependsOn(dependsOn.findAll { !((it instanceof Task || it instanceof TaskProvider) && it.name == 'javadocJar') })
    }
}

group = 'Ziggfreed'
version = api_version

base {
    archivesName = 'rpg-stations-api'
}

repositories {
    mavenCentral()
}

def hytaleServerJar = new File("${hytaleHome}/${patchline}/package/game/${game_build}/Server/HytaleServer.jar")
// The sibling ziggfreed-common repo's build output: repo.ziggfreed-common in the workspace's path map
// (family.properties at workspaceRoot, which the root gradle.properties gives relative to the root
// project dir).
def workspaceDir = rootProject.file(workspaceRoot)
def familyMapFile = new File(workspaceDir, 'family.properties')
if (!familyMapFile.isFile()) {
    throw new GradleException("no family.properties at ${workspaceDir.canonicalPath} (workspaceRoot=${workspaceRoot} in gradle.properties)")
}
def familyMap = new Properties()
familyMapFile.withReader('UTF-8') { familyMap.load(it) }
def zcRepo = familyMap.getProperty('repo.ziggfreed-common')?.trim()
if (!zcRepo) {
    throw new GradleException("family.properties at ${workspaceDir.canonicalPath} has no repo.ziggfreed-common")
}
def ziggfreedCommonJar = new File(workspaceDir, "${zcRepo}/build/libs/ZiggfreedCommon-${ziggfreedCommonVersion}.jar")

dependencies {
    api 'com.google.code.findbugs:jsr305:3.0.2'

    compileOnly(files(hytaleServerJar))
    compileOnly(files(ziggfreedCommonJar))
}

// Same repo-wide deprecation rule as the mod's own compileJava (see build.gradle), the removal
// flag and the deprecation gate both - this module also compiles against the Hytale server jar
// and its classes ship bundled in the mod jar, so it gets the same hard-fail treatment.
compileJava {
    options.compilerArgs << '-Xlint:removal' << '-Werror'
}

apply from: "$rootDir/gradle/deprecation-gate.gradle"
